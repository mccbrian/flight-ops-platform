name: Flight Ops CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build Flight Ops Platform
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java --version
          mvn --version

      - name: Build shared Avro contracts
        run: mvn -B -ntp -f shared-libraries/event-contracts/pom.xml -DskipTests install

      - name: Build ingestion service
        run: mvn -B -ntp -f microservices/ingestion-service/pom.xml -DskipTests package

      - name: Build processing service
        run: mvn -B -ntp -f microservices/processing-service/pom.xml -DskipTests package
        
      - name: Run ingestion unit tests
        run: mvn -B -ntp -f microservices/ingestion-service/pom.xml test

      - name: Run processing unit tests
        run: mvn -B -ntp -f microservices/processing-service/pom.xml test

      - name: Run ingestion integration tests
        run: mvn -B -ntp -f microservices/ingestion-service/pom.xml '-Dtest=*IT' test

      - name: Run processing integration tests
        run: mvn -B -ntp -f microservices/processing-service/pom.xml '-Dtest=*IT' test
